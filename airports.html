<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:#fff;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#000;
  border-bottom:2px solid #d4af37;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:#d4af37;
  font-size:1.5rem;
  font-weight:bold;
  letter-spacing:2px;
}

.menu-btn{
  background:none;
  border:none;
  color:#d4af37;
  font-size:30px;
  cursor:pointer;
}

.mobile-menu{
  position:fixed;
  top:0;
  right:-300px;
  width:280px;
  height:100%;
  background:#111;
  transition:.3s;
  padding-top:80px;
  box-shadow:-5px 0 15px rgba(0,0,0,.5);
}

.mobile-menu.active{
  right:0;
}

.mobile-menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:18px 25px;
  border-bottom:1px solid #222;
}

.mobile-menu a:hover{
  background:#d4af37;
  color:#000;
}

.call-btn{
  margin:20px;
  background:#d4af37;
  color:#000 !important;
  text-align:center;
  border-radius:6px;
  font-weight:bold;
}
</style>

<script>
function toggleMenu() {
  document.getElementById("mobileMenu")
    .classList.toggle("active");
}
</script>
